<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>В? О! - Вход</title>
    <link rel="stylesheet" href="static/css/bootstrap.min.css">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <header class="site-header bg-white py-2 border-bottom sticky-top">
        <div class="container d-flex justify-content-center">
            <a href="index.html" class="logo text-decoration-none fs-4 fw-bold text-dark">В? О!</a>
        </div>
    </header>

    <main class="site-main py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="form-card p-4 border rounded bg-white shadow-sm">
                        <h2 class="h4 fw-bold mb-4 text-center">Авторизация</h2>
                        <div class="alert alert-danger py-2 small mb-3 text-center">Неверный логин или пароль</div>
                        <form>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Логин</label>
                                <input type="text" class="form-control rounded-pill">
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-bold">Пароль</label>
                                <input type="password" class="form-control rounded-pill">
                            </div>
                            <button type="submit" class="btn btn-custom-primary rounded-pill w-100 fw-bold mb-3 shadow-sm">Войти</button>
                            <div class="text-center small">
                                <a href="signup.html" class="text-muted text-decoration-none">Нет аккаунта? Зарегистрируйтесь</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
