<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>В? О! - Профиль</title>
    <link rel="stylesheet" href="static/css/bootstrap.min.css">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <header class="site-header bg-white py-2 border-bottom sticky-top">
        <div class="container d-flex flex-wrap align-items-center justify-content-between gap-2">
            <a href="index.html" class="logo text-decoration-none fs-4 fw-bold text-dark shrink-0">В? О!</a>
            <div class="user-block d-flex align-items-center gap-3">
                <img src="static/img/avatar-default.png" alt="Федор" class="author-avatar rounded-circle" width="36" height="36">
                <span class="fw-medium">Федор</span>
                <a href="login.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3">Выйти</a>
            </div>
        </div>
    </header>

    <main class="site-main py-4">
    <div class="container">
        <div class="row justify-content-center">
            
            <div class="col-12 col-md-10 col-lg-8">
                <h1 class="h3 fw-bold mb-4 text-center">Настройки профиля</h1>
                <div class="form-card p-4 border rounded bg-white shadow-sm">
                    <form class="row">
                        <div class="col-md-4 text-center mb-4">
                            <img src="static/img/avatar-default.png" class="rounded-circle border mb-3" style="width: 140px; height: 140px; object-fit: cover;">
                            <input type="file" class="form-control form-control-sm">
                        </div>
                        <div class="col-md-8">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Логин</label>
                                <input type="text" class="form-control rounded-pill bg-light" value="fedor_dev" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Email</label>
                                <input type="email" class="form-control rounded-pill" value="fedor@mail.ru">
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-bold">Никнейм</label>
                                <input type="text" class="form-control rounded-pill" value="Федор">
                            </div>
                            <button type="submit" class="btn btn-custom-primary rounded-pill px-5 fw-bold shadow-sm">Сохранить</button>
                        </div>
                    </form>
                </div>

            </div> </div> </div>
</main>
</body>
</html>
