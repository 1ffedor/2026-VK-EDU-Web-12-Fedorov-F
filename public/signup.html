<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>В? О! - Регистрация</title>
    <link rel="stylesheet" href="static/css/bootstrap.min.css">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <header class="site-header bg-white py-2 border-bottom sticky-top">
        <div class="container d-flex justify-content-center">
            <a href="index.html" class="logo text-decoration-none fs-4 fw-bold text-dark">В? О!</a>
        </div>
    </header>

    <main class="site-main py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="form-card p-4 border rounded bg-white shadow-sm">
                        <h2 class="h4 fw-bold mb-4">Создать аккаунт</h2>
                        <form>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Логин</label>
                                <input type="text" class="form-control rounded-pill is-valid">
                                <div class="valid-feedback small">Логин доступен!</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Email</label>
                                <input type="email" class="form-control rounded-pill">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Никнейм</label>
                                <input type="text" class="form-control rounded-pill">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Пароль</label>
                                <input type="password" class="form-control rounded-pill">
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-bold">Аватар</label>
                                <input type="file" class="form-control form-control-sm">
                            </div>
                            <button type="submit" class="btn btn-custom-primary rounded-pill w-100 fw-bold shadow-sm">Зарегистрироваться</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
